.sub-row.hold{position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .15s;}
.sub-row.hold > *:not(.sub-fill){position:relative;z-index:1;}
.sub-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(78,240,154,.28);z-index:0;}
.sub-row.holding{transform:scale(.98);}
.sub-row.holding .sub-fill{width:100%;transition:width 1s linear;}
.sub-row.hold{border:1.5px solid rgba(78,240,154,.55);padding:10px 12px;animation:subGlow 2.6s ease-in-out infinite;}
.sub-row.hold:not(.is-done) .sub-label{color:#d8d8d8;}
.sub-ok{min-width:16px;text-align:right;font-weight:700;color:#4ef09a;font-size:14px;}
.sub-row.is-done{background:rgba(78,240,154,.16);border-color:#4ef09a;animation:none;}
@keyframes subGlow{0%,100%{box-shadow:0 0 0 0 rgba(78,240,154,0)}50%{box-shadow:0 0 10px -2px rgba(78,240,154,.45)}}
.sub-row.is-done .sub-label{color:#7fdcae;}
.sub-row.is-done .sub-fill{background:rgba(240,78,78,.25);}
.hold-hint{font-family:'DM Mono',monospace;font-size:9px;color:#444;letter-spacing:.5px;margin-top:8px;text-align:right;}
.block.just-done{animation:blkDone .8s ease-out;}
@keyframes blkDone{0%{box-shadow:0 0 0 0 rgba(78,240,154,.7);transform:scale(1)}30%{transform:scale(1.02)}100%{box-shadow:0 0 0 14px rgba(78,240,154,0);transform:scale(1)}}
.xp-float{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:#e8f04e;text-shadow:0 0 14px #e8f04e;animation:xpUp 1.1s ease-out forwards;}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
.rc-card{margin-top:14px;background:#121212;border:1px solid #242424;border-radius:16px;padding:14px;}
.rc-head{display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:#888;font-weight:700;margin-bottom:12px;}
.rc-head button{border:1px solid #2a2a2a;background:#0f0f0f;color:#aaa;border-radius:8px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0;cursor:pointer;}
.rc-top{display:flex;gap:14px;align-items:center;}
.rc-ring{position:relative;width:92px;height:92px;flex-shrink:0;}
.rc-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.rc-bg{fill:none;stroke:#222;stroke-width:9;}
.rc-fg{fill:none;stroke:var(--rcc);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--rcc));transition:stroke-dashoffset .8s;}
.rc-num{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:28px;}
.rc-num b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:38px;color:#f0ede8;line-height:1;}
.rc-num span{font-family:'DM Mono',monospace;font-size:11px;color:#888;margin-left:2px;}
.rc-info{flex:1;min-width:0;text-align:left;}
.rc-grade{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1.5px;color:var(--rcc);line-height:1;}
.rc-msg{font-size:12.5px;color:#bbb;margin-top:4px;line-height:1.35;}
.rc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.rc-chips span{font-family:'DM Mono',monospace;font-size:10px;padding:3px 7px;border-radius:6px;background:#1c1c1c;color:#ddd;}
.rc-lvl{margin:14px 0 10px;}
.rc-lvl-t{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;color:#777;margin-bottom:5px;}
.rc-lvl-t b{color:#e8f04e;font-weight:700;letter-spacing:1px;}
.rc-lvl-bar{height:6px;border-radius:3px;background:#242424;overflow:hidden;}
.rc-lvl-bar i{display:block;height:100%;background:linear-gradient(90deg,#f09a4e,#e8f04e);border-radius:3px;}
.rc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.rc-stats div{background:#181818;border-radius:10px;padding:8px 4px;text-align:center;}
.rc-stats b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:22px;color:#f0ede8;line-height:1.1;}
.rc-stats span{font-family:'DM Mono',monospace;font-size:9px;color:#777;}
.rc-rows{display:flex;flex-direction:column;gap:4px;}
.rc-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:#161616;font-size:13px;color:#888;}
.rc-row .rc-t{flex:1;min-width:0;text-align:left;}
.rc-row b{font-family:'DM Mono',monospace;font-size:11px;color:#666;}
.rc-row.ok{background:rgba(78,240,154,.08);color:#e6e6e6;}
.rc-row.ok b{color:#4ef09a;font-size:14px;}
.gc-card.rc-big{max-width:380px;max-height:88vh;overflow-y:auto;padding:22px 16px 16px;}
.rc-big .gc-kick{margin:0 0 12px;}
.rc-big .gc-btn{margin-top:14px;}
@media (prefers-reduced-motion:reduce){.sub-row.hold{animation:none;}.sub-row.holding .sub-fill{transition:none;}.xp-float,.block.just-done{animation:none!important;}}

#nav-row::-webkit-scrollbar{display:none}
#nav-row>div{flex-shrink:0;white-space:nowrap}

.eg-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.eg-pill{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:5px;}
.eg-max{background:#f0ede8;color:#000;}
.eg-rir{background:#1c1c1c;color:#ccc;border:1px solid #333;}
.eg-box{background:#141414;border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.eg-head{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--accent);line-height:1;}
.eg-line{font-family:'DM Sans',sans-serif;font-size:12px;color:#bbb;letter-spacing:0;margin-top:4px;line-height:1.4;}
.reps-btn.cap{border-color:var(--accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.reps-btn.cap small{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;margin-top:2px;}
.reps-btn.cur{background:rgba(78,240,154,0.12);}
#pu-overlay{display:none;position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:20px;}
#pu-overlay.show{display:flex;animation:puFade .2s ease-out;}
#pu-overlay.up{--pc:#e8f04e;} #pu-overlay.down{--pc:#6ea8ff;}

.sh-chip.edit{cursor:default;border-style:dashed;}
.sh-chip.edit button{border:none;background:none;color:var(--red);font-size:16px;padding:0 0 0 2px;cursor:pointer;line-height:1;}
.sh-clear{display:block;margin:26px auto 0;border:none;background:none;color:#555;font-family:'DM Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;}

.sh-stepper{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.sh-stepper button{width:34px;height:34px;border-radius:8px;border:1px solid #2a2a2a;background:#0f0f0f;color:#ddd;font-size:17px;cursor:pointer;padding:0;line-height:1;}
.sh-stepper b{min-width:26px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);font-weight:400;}
.sh-n{font-family:'DM Mono',monospace;font-size:12px;color:#888;}
.sh-chip small.sh-cn{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:#000;background:var(--green);border-radius:99px;padding:1px 7px;}
.sh-nsel{flex:0 0 64px;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:22px;padding:0 8px;text-align:center;text-align-last:center;}

#inv-app .sh-row{padding:6px 8px 6px 12px;margin-bottom:4px;}
#inv-app .sh-cat{margin:12px 0 6px;}
#inv-app .sh-stepper button{width:30px;height:30px;font-size:15px;}
#inv-app .sh-stepper b{font-size:19px;min-width:22px;}
#inv-app .sh-name{font-size:14px;}

.sh-modes{display:flex;gap:6px;margin:14px 0 12px;}
.sh-modes button{flex:1;padding:10px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#888;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;}
.sh-modes button.on{background:var(--accent);border-color:var(--accent);color:#000;}
.sh-chip.on{padding:4px 4px 4px 4px;gap:4px;cursor:default;}
.sh-chip.on .sh-ct{cursor:pointer;padding:4px 2px;}
.sh-cm{width:28px;height:28px;border-radius:99px;border:1px solid rgba(78,240,154,.5);background:none;color:var(--green);font-size:16px;line-height:1;cursor:pointer;padding:0;}
b.sh-cn{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:18px;color:#000;background:var(--green);border-radius:99px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;cursor:pointer;}
#inv-app .sh-chip{font-size:14px;}

.sh-sec{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px;padding-bottom:8px;border-bottom:1px solid #1e1e1e;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent);}
.sh-sec b{color:#000;background:var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;letter-spacing:0;}
.sh-clear2{border:1px solid #2a2a2a;background:none;color:#888;border-radius:8px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:0;}
.sh-list{background:#101010;border:1px solid #1f1f1f;border-radius:12px;padding:4px 10px 12px;}
.sh-lcat{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#666;margin:10px 0 6px;}
.sh-chip.in{border-color:rgba(78,240,154,.35);color:#9fe8c0;}
.sh-inn{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;color:#000;background:var(--green);border-radius:99px;padding:1px 6px;}
.sh-sec .sh-edit{padding:6px 10px;font-size:10px;letter-spacing:0;}

.sh-chip.on .sh-un{font-family:'DM Mono',monospace;font-size:12px;color:#9fe8c0;padding-right:10px;}
.sh-uh{font-family:'DM Mono',monospace;font-size:10px;color:#666;}
#inv-app .sh-catsel{flex:1;min-width:0;}

.sh-got{width:28px;height:28px;border-radius:99px;border:1.5px solid var(--green);background:none;color:var(--green);font-size:14px;font-weight:700;line-height:1;cursor:pointer;padding:0;}
.sh-chip.got{opacity:.5;text-decoration:line-through;border-color:#2a2a2a;color:#888;}
.sh-chip.got small{font-family:'DM Mono',monospace;font-size:10px;}

#tabbar-old{position:fixed;left:0;right:0;bottom:0;z-index:700;display:flex;background:rgba(10,10,10,.97);border-top:1px solid #2a2a2a;padding:6px 4px calc(6px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
#tabbar-old .tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 0 6px;border:none;background:none;border-radius:12px;cursor:pointer;color:#777;-webkit-tap-highlight-color:transparent;}
#tabbar-old .tb-i{font-size:24px;line-height:1;filter:grayscale(1) opacity(.55);transition:transform .15s;}
#tabbar-old .tb-l{font-family:'DM Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
#tabbar-old .tb.on{color:var(--accent);background:rgba(232,240,78,.08);}
#tabbar-old .tb.on .tb-i{filter:none;transform:scale(1.1);}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom));}
#gym-timer{bottom:calc(88px + env(safe-area-inset-bottom)) !important;}
.gym-rule{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#141407;border:1px solid #3a3d12;}
.gym-rule b{display:block;color:#e8f04e;font-size:13px;margin-bottom:2px;} .gym-rule span{font-size:12px;color:#aaa;line-height:1.4;}
.eg-chg{margin:6px 0 4px;padding:7px 10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.3px;}
.eg-chg small{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:2px;letter-spacing:0;}
.eg-chg.down{background:rgba(110,168,255,.12);border:1px solid #6ea8ff;color:#9cc2ff;}
.eg-chg.up{background:rgba(78,240,154,.1);border:1px solid #4ef09a;color:#4ef09a;}
.rw-warn{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;background:#2a2410;border:1px solid #6b5a1a;color:#e8d36a;font-size:12px;line-height:1.4;}
.gym-past{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:12px 14px;border-radius:12px;background:rgba(78,240,154,.08);border:1px solid rgba(78,240,154,.35);}
.gym-past b{display:block;color:#4ef09a;font-size:14px;} .gym-past span{font-family:'DM Mono',monospace;font-size:10px;color:#8a8;}
.gym-past button{flex:none;border:1px solid #333;background:#0f0f0f;color:#ddd;border-radius:10px;padding:9px 10px;font-family:'DM Mono',monospace;font-size:10.5px;cursor:pointer;}
.gym-past-list{pointer-events:none;}
#pu-toast{top:16px;}
@media (min-width:900px){#tabbar-old{left:50%;right:auto;transform:translateX(-50%);width:640px;border:1px solid #2a2a2a;border-radius:18px 18px 0 0;}}

.rw-btn.sug{border:2px solid var(--accent);color:var(--accent);}
.reps-btn.sel{background:var(--accent)!important;border-color:var(--accent)!important;color:#000!important;}
.reps-btn.cur{background:#0f0f0f;}
.reps-save{display:block;width:100%;margin:4px 0 10px;padding:15px;border-radius:12px;border:1px dashed #3a3a3a;background:#111;color:#777;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;}
.reps-save.ready{border:none;background:var(--green);color:#000;font-size:13px;}
.reps-save.shake{animation:rsShake .35s;}
@keyframes rsShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.gc-wrap{margin:22px 0 8px;}
.gc-track{position:relative;height:64px;border-radius:99px;background:#121212;border:1px solid #2a2a2a;overflow:hidden;user-select:none;-webkit-user-select:none;}
.gc-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:56px;font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:2px;color:#666;pointer-events:none;z-index:1;}
.gc-track.locked .gc-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;color:#555;}
.gc-lockfill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.035);}
.gc-knob{position:absolute;left:4px;top:4px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#000;background:var(--gc);z-index:3;touch-action:none;cursor:grab;box-shadow:0 0 0 4px rgba(0,0,0,.25),0 0 22px -2px var(--gc);}
.gc-knob.locked{background:#1c1c1c;color:#555;box-shadow:none;font-size:20px;cursor:not-allowed;}
.gc-track.ready{border-color:var(--gc);animation:gcPulse 2s ease-in-out infinite;}
.gc-fill{position:absolute;left:0;top:0;bottom:0;width:52px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--gc));opacity:calc(.25 + var(--gp,0)*.75);z-index:2;}
.gc-shimmer{background:linear-gradient(90deg,#555 0%,#555 40%,#fff 50%,#555 60%,#555 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gcShim 2.4s linear infinite;}
.gc-track.armed .gc-label{color:#000;-webkit-text-fill-color:#000;background:none;animation:none;}
.gc-track.fired{animation:gcFire .4s ease-out;}
.gc-track.done{height:auto;min-height:64px;padding:12px 18px;display:flex;flex-direction:column;justify-content:center;background:var(--gc);border-color:var(--gc);}
.gc-done-txt{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:#000;line-height:1;}
.gc-done-sub{font-family:'DM Mono',monospace;font-size:10.5px;color:rgba(0,0,0,.65);margin-top:4px;}
.gc-undo{display:block;margin:8px auto 0;border:none;background:none;color:#555;font-family:'DM Mono',monospace;font-size:10px;text-decoration:underline;cursor:pointer;}
@keyframes gcPulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 22px -6px var(--gc)}}
@keyframes gcShim{0%{background-position:100% 0}100%{background-position:-150% 0}}
@keyframes gcFire{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
#gc-overlay{display:none;position:fixed;inset:0;z-index:980;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px;overflow:hidden;}
#gc-overlay.show{display:flex;animation:puFade .25s ease-out;}
.gc-conf{position:absolute;inset:0;pointer-events:none;}
.gc-conf i{position:absolute;top:-20px;border-radius:2px;animation:gcFall var(--t) var(--d) cubic-bezier(.2,.6,.4,1) forwards;}
@keyframes gcFall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),110vh) rotate(var(--r))}}
.gc-card{position:relative;width:100%;max-width:340px;text-align:center;padding:28px 20px 20px;border-radius:22px;background:#0f0f0f;border:1px solid var(--gc);box-shadow:0 0 80px -16px var(--gc);animation:puPop .55s cubic-bezier(.2,1.6,.4,1);}
.gc-ring{position:relative;width:110px;height:110px;margin:0 auto;}
.gc-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.gc-ring-bg{fill:none;stroke:#1f1f1f;stroke-width:8;}
.gc-ring-fg{fill:none;stroke:var(--gc);stroke-width:8;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;animation:gcRing .8s .15s ease-out forwards;}
.gc-check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:var(--gc);animation:puGrow .5s .7s both;}
@keyframes gcRing{to{stroke-dashoffset:0}}
.gc-kick{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--gc);margin-top:14px;}
.gc-title{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:.95;letter-spacing:3px;color:#f0ede8;}
.gc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 12px;}
.gc-stats div{background:#151515;border-radius:10px;padding:10px 4px;}
.gc-stats b{display:block;font-family:'Bebas Neue',sans-serif;font-size:28px;font-weight:400;color:var(--gc);line-height:1;}
.gc-stats span{font-family:'DM Mono',monospace;font-size:9.5px;color:#777;}
.gc-week{font-size:18px;letter-spacing:4px;color:var(--gc);}
.gc-week span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;color:#888;vertical-align:middle;}
.gc-msg{font-size:13px;color:#aaa;margin:10px 0 16px;}
.gc-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--gc);color:#000;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;cursor:pointer;}
@media (prefers-reduced-motion:reduce){.gc-track,.gc-shimmer,#gc-overlay *{animation:none!important;}.gc-ring-fg{stroke-dashoffset:0;}}

#tabbar-old .tb-i{font-size:21px;}
#tabbar-old .tb-l{font-size:9.5px;letter-spacing:0;}
#tabbar-old .tb{padding:7px 0 5px;}

.rt-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
.rt-sub{font-family:'DM Mono',monospace;font-size:11px;color:#888;margin-top:6px;}
.rt-editbtn{border:1px solid #2a2a2a;background:#0f0f0f;color:#999;border-radius:8px;padding:8px 12px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;}
.rt-editbtn.on{border-color:var(--green);color:var(--green);}
.rt-sos{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;margin:4px 0 20px;padding:18px 16px 16px;border-radius:18px;border:none;background:linear-gradient(160deg,#ff5a5a,#c62828);color:#fff;text-align:center;cursor:pointer;box-shadow:0 6px 24px rgba(240,60,60,.35),inset 0 1px 0 rgba(255,255,255,.25);animation:sosGlow 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent;}

.rt-sos small{font-family:'DM Mono',monospace;font-size:10.5px;color:rgba(255,255,255,.85);margin-top:4px;}
@keyframes sosGlow{0%,100%{box-shadow:0 6px 24px rgba(240,60,60,.30),inset 0 1px 0 rgba(255,255,255,.25);}50%{box-shadow:0 6px 34px rgba(240,60,60,.60),inset 0 1px 0 rgba(255,255,255,.25);}}
.rt-fail{display:block;width:100%;margin-top:10px;padding:10px 12px 9px;border-radius:14px;border:1.5px solid #c84a4a;background:rgba(240,78,78,.07);color:#ff8a8a;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;}
.rt-fail:active{background:rgba(240,78,78,.18);transform:scale(.98);}
.rt-fail b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:19px;letter-spacing:2px;line-height:1.1;}
.rt-fail small{display:block;font-family:'DM Mono',monospace;font-size:9.5px;color:#b77;margin-top:2px;}
.rt-card{position:relative;background:#121212;border:1px solid #232323;border-radius:18px;padding:16px;margin-bottom:14px;overflow:hidden;transition:transform .2s;}
.rt-card::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--rc);}
.rt-card.pop{animation:rtPop .45s cubic-bezier(.2,1.6,.4,1);}
.rt-top{display:flex;gap:16px;align-items:center;}
.rt-ring{position:relative;width:112px;height:112px;flex-shrink:0;}
.rt-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.rt-rbg{fill:none;stroke:#222;stroke-width:9;}
.rt-rfg{fill:none;stroke:var(--rc);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--rc));}
.rt-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.rt-num span{font-family:'DM Mono',monospace;font-size:10px;color:#888;}
.rt-info{flex:1;min-width:0;}
.rt-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;color:var(--rc);line-height:1;}
.rt-next{font-size:13px;color:#ccc;margin-top:6px;} .rt-next b{color:#f0ede8;}
.rt-left{font-family:'DM Mono',monospace;font-size:11px;color:var(--rc);margin-top:3px;}
.rt-meta{font-family:'DM Mono',monospace;font-size:10px;color:#666;margin-top:6px;} .rt-meta b{color:#aaa;font-weight:500;}

.rt-add{display:block;width:100%;padding:12px;margin:8px 0;border:1px dashed #333;border-radius:12px;background:none;color:#999;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;}
.rt-sec{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#666;margin:18px 0 8px;text-transform:uppercase;}

#rt-sos{display:none;position:fixed;inset:0;z-index:990;background:#050508;align-items:center;justify-content:center;padding:24px;}
#rt-sos.show{display:flex;animation:puFade .3s ease-out;}
.sos-in{width:100%;max-width:360px;text-align:center;}
.sos-k{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;color:#7a8aa8;}
.sos-circle{position:relative;width:200px;height:200px;margin:22px auto 10px;display:flex;align-items:center;justify-content:center;}

<script>
const MONTHS_LONG=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_SHORT=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DAY_IDS=['lun','mar','mie','jue','vie','sab','dom'];
const DAY_LABELS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];

function safeParse(k, fallback){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}

function midiaToast(msg, color){
  let t = document.getElementById('midia-toast');
  if(!t){
    t = document.createElement('div'); t.id = 'midia-toast';
    t.style.cssText = "position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;pointer-events:none;max-width:90vw;padding:12px 16px;border-radius:10px;background:#1a1a1a;border:1px solid #333;font-family:'DM Sans',sans-serif;font-size:13px;color:#f0ede8;box-shadow:0 12px 40px rgba(0,0,0,0.9);display:none;";
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.borderColor = color || '#333'; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.display='none'; }, 5000);
}

(function(){
  const orig = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    try{ return orig.call(this, k, v); }
    catch(e){ midiaToast('No se ha podido guardar. Descarga una copia de seguridad desde Progreso.', '#f04e4e'); }
  };
})();

function midiaKeys(){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf('midia_')===0) keys.push(k); }
  return keys;
}

function exportBackup(){
  const data = { app:'migym', version:1, exportedAt:new Date().toISOString(), data:{} };
  midiaKeys().forEach(k=>{ data.data[k] = localStorage.getItem(k); });
  const d = new Date(); const pad = n=>String(n).padStart(2,'0');
  const name = 'migym-copia-' + d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + '.json';
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const file = (typeof File!=='undefined') ? new File([blob], name, {type:'application/json'}) : null;
  const done = ()=>{ localStorage.setItem('midia_lastbackup', new Date().toISOString()); renderGym(); };
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).then(done).catch(()=>{});
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  done();
}

function importBackup(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    let backup;
    try{ backup = JSON.parse(r.result); }catch(e){ backup = null; }
    if(!backup || backup.app!=='migym' || !backup.data){ midiaToast('Ese archivo no es una copia de Mi Gym.', '#f04e4e'); input.value=''; return; }
    if(!confirm('Vas a restaurar la copia del ' + new Date(backup.exportedAt).toLocaleString('es-ES') + '. Se sustituirán los datos actuales. ¿Continuar?')){ input.value=''; return; }
    const mergeById = (k)=>{
      let cur = safeParse(k, []), inc = [];
      try{ inc = JSON.parse(backup.data[k] || '[]'); }catch(e){}
      const ids = new Set(cur.map(x=>x.id));
      inc.forEach(x=>{ if(!ids.has(x.id)) cur.push(x); });
      localStorage.setItem(k, JSON.stringify(cur));
    };
    Object.keys(backup.data).forEach(k=>{
      if(k.indexOf('midia_')!==0 || k==='midia_lastbackup') return;
      localStorage.setItem(k, backup.data[k]);
    });
    midiaToast('Copia restaurada. Recargando…', '#4ef09a');
    setTimeout(()=>location.reload(), 900);
  };
  r.readAsText(f);
}

function backupHTML(){
  const last = localStorage.getItem('midia_lastbackup');
  const lastTxt = last ? 'Última copia: ' + new Date(last).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}) : 'Aún no has hecho ninguna copia';
  const btn = "border-radius:8px;padding:9px 14px;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.5px;";
  return '<div style="border-top:1px solid #242424;margin-top:28px;padding-top:16px;">' +
    '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:4px;">Copia de seguridad</div>' +
    '<div style="font-size:12px;color:#777;margin-bottom:12px;">Tus pesos y tu progreso se guardan solo en este móvil. Descarga una copia de vez en cuando y guárdala en iCloud o Drive.</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
      '<button onclick="exportBackup()" style="' + btn + 'background:#e8f04e;color:#000;border:none;">Descargar copia</button>' +
      '<label style="' + btn + 'background:#141414;color:#f0ede8;border:1px solid #242424;display:inline-block;">Restaurar copia<input type="file" accept="application/json,.json" onchange="importBackup(this)" style="display:none;"></label>' +
      '<span style="font-size:11px;color:#555;font-family:\'DM Mono\',monospace;">' + lastTxt + '</span>' +
    '</div>' +
    '</div>';
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);
}

// ── EXERCISE STATE ────────────────────────────────────────────────────────────
let gymPastIso=null; const gymRedo={};
function exKey(){return 'midia_gymday_'+(gymPastIso||todayISO());}
function exDayKey(){return 'g'+todayISO();}
function getExData(){try{return JSON.parse(localStorage.getItem(exKey())||'{}');}catch{return{};}}
function saveExData(d){localStorage.setItem(exKey(),JSON.stringify(d));}
function targetReps(reps){return parseInt(String(reps).match(/\d+/)?.[0]||'10',10);}
function getRepsValue(value,legacyValue=null){return typeof value==='number'?value:(value===true?legacyValue:(value?.reps||null));}
function loadLog(){try{return JSON.parse(localStorage.getItem('midia_exlog')||'{}');}catch{return{};}}
function saveLog(log){localStorage.setItem('midia_exlog',JSON.stringify(log));}
function repRange(reps){
  const values=String(reps).match(/\d+/g)||[];
  return values.length>1?[+values[0],+values.at(-1)]:[Math.max(1,targetReps(reps)-3),targetReps(reps)+3];
}
function logSet(exName,weight,si,reps,rt){
  const log=loadLog(),day=exDayKey(); log[exName]??=[];
  let entry=log[exName].find(e=>e.day===day);
  if(!entry){entry={day,ts:Date.now(),weight,sets:[],setW:[]};log[exName].push(entry);}
  entry.setW??=[]; if(rt) entry.rt=rt;
  entry.setW[si]=weight; entry.weight=entry.setW.find(Boolean)||weight; entry.ts=Date.now(); entry.sets[si]=reps;
  log[exName]=log[exName].slice(-20); saveLog(log);
}
function unlogSet(exName,si){
  const log=loadLog(),entry=log[exName]?.find(e=>e.day===exDayKey());
  if(!entry)return;
  entry.sets[si]=null;
  if(entry.sets.every(x=>!x))log[exName]=log[exName].filter(e=>e.day!==exDayKey());
  saveLog(log);
}
function prevLine(ex,routine){
  const last=exHistory(ex.name,routine).at(-1); if(!last) return '';
  const sets=entrySets(last); const same=sets.every(x=>x.w===sets[0].w);
  return `<div class="exs-history">Anterior: <b>${same?sets[0].w+' · '+sets.map(x=>x.r).join('-'):sets.map(x=>x.w+'×'+x.r).join(' · ')}</b></div>`;
}


// ── PROGRESIÓN (doble progresión) ─────────────────────────────────────────────
function routineOf(bid){
  if(/^gym\d/.test(String(bid))) return GYM_ROUTINES[Number(String(bid).slice(3))];
  return null;
}
function exOf(bid,exName){
  const r=routineOf(bid);
  return (EXERCISES[r]||[]).find(x=>x.name===exName) || Object.values(EXERCISES).flat().find(x=>x.name===exName);
}
function wNum(w){ if(!w) return 0; const s=String(w); if(/asist/i.test(s)) return -1; const n=parseFloat((s.match(/[\d.]+/)||['0'])[0]); return /PC/.test(s)? 1000+n : n; }
function wIdx(ex,w){
  const L=ex.weights||[]; let i=L.indexOf(w); if(i>=0) return i;
  const n=wNum(w); let best=0; L.forEach((x,j)=>{ if(Math.abs(wNum(x)-n)<Math.abs(wNum(L[best])-n)) best=j; }); return best;
}
function wStep(ex,w,delta){ const L=ex.weights||[]; if(!L.length) return w; const i=Math.max(0,Math.min(L.length-1,wIdx(ex,w)+delta)); return L[i]; }
function exHistory(exName,routine,incToday){
  const all=(loadLog()[exName]||[]).filter(e=>(incToday||e.day!==exDayKey()) && e.sets.some(Boolean));
  const same=all.filter(e=>e.rt===routine);
  return same.length ? same : all.filter(e=>!e.rt);
}
function entrySets(e){ return e.sets.map((r,i)=>({r:r||0, w:(e.setW&&e.setW[i])||e.weight})).filter(x=>x.r); }
function exRec(ex,routine,incToday){
  const [lo,hi]=repRange(ex.reps), h=exHistory(ex.name,routine,incToday), last=h.at(-1);
  if(!last){ const w=ex.start||(ex.weights&&ex.weights[0])||''; return {w,kind:'start',msg:`Primera vez · si llegas a ${hi} en todas, sube`}; }
  const sets=entrySets(last), W0=sets[0]?sets[0].w:last.weight;
  const atW=sets.filter(x=>x.w===W0), txt=sets.every(x=>x.w===W0) ? sets.map(x=>x.r).join('-')+' con '+W0 : sets.map(x=>x.w+'×'+x.r).join(' · ');
  if(atW.length>=ex.sets && atW.every(x=>x.r>=hi)){
    const up=wStep(ex,W0,1);
    return up===W0 ? {w:W0,kind:'keep',msg:`${txt} · tope de la lista de pesos`} : {w:up,from:W0,kind:'up',why:`Hiciste ${hi} en todas las series con ${W0}`,msg:`${txt} · ¡toca subir!`};
  }
  // La última serie no cuenta: quedarse corto ahí por cansancio es normal.
  const body=ss=>ss.length>1?ss.slice(0,-1):ss;
  // Evidente: tuvo que bajar el peso antes de la última serie, o la 1ª serie se quedó 2+ reps por debajo del mínimo.
  const evident=(ss,w)=> body(ss).some(x=>wNum(x.w)<wNum(w)) || (ss[0] && ss[0].r<=lo-2);
  // Por poco: alguna serie (salvo la última) por debajo del mínimo.
  const mild=(ss,w)=> body(ss).some(x=>x.r<lo);
  const dn=wStep(ex,W0,-1);
  if(dn!==W0 && evident(sets,W0)){
    const why = body(sets).some(x=>wNum(x.w)<wNum(W0)) ? `Tuviste que bajar de ${W0} para completar las series` : `La 1ª serie se quedó en ${sets[0].r} (mínimo ${lo})`;
    return {w:dn,from:W0,kind:'down',why,msg:why};
  }
  if(mild(sets,W0)){
    const prev=h.at(-2), ps=prev?entrySets(prev):[];
    if(dn!==W0 && ps[0] && ps[0].w===W0 && (mild(ps,W0)||evident(ps,W0))){ const why=`Dos sesiones seguidas sin llegar a ${lo} con ${W0}`; return {w:dn,from:W0,kind:'down',why,msg:why}; }
    return {w:W0,kind:'keep',warn:true,msg:`${txt} · te quedaste cerca de ${lo}. Repite ${W0}; si vuelve a pasar, baja solo`};
  }
  return {w:W0,kind:'keep',msg:`${txt} · mantén y llega a ${hi} en todas`};
}
function gymRuleHTML(){
  return `<div class="gym-rule"><b>🎯 Mantén el peso, juega con las reps</b><span>Si salen menos repeticiones, no pasa nada: repite el peso la próxima vez. Baja solo si te quedas muy lejos del mínimo o se rompe la técnica.</span></div>`;
}
const EFFORT_SAFE=['Barbell Squat','DB RDLs','Bulgarian Split Squat','Cossack Squat','Step Ups · Cajón alto','Incline Smith Press','Flat Smith Press','Flat Press','Dips','Incline DB Press'];
const EFFORT_MACHINE=['Lat Pulldown','Low Row','Cable Rows'];
function effortFor(ex,si){
  const hi=repRange(ex.reps)[1], last=(si!==null && si===ex.sets-1);
  if(EFFORT_SAFE.includes(ex.name))
    return {pill:'RESERVA 2', head:`PARA EN ${hi} · RESERVA 2`, line:`Para al llegar a ${hi} o cuando sientas que solo podrías hacer 2 más. Nunca al fallo en este ejercicio.`};
  if(EFFORT_MACHINE.includes(ex.name)){
    if(si===null) return {pill:'RESERVA 2 · ÚLTIMA 1'};
    return last ? {head:`PARA EN ${hi} · RESERVA 1`, line:`Última serie: aprieta hasta que solo podrías hacer 1 más. Máximo ${hi}.`}
                : {head:`PARA EN ${hi} · RESERVA 2`, line:`Para al llegar a ${hi} o cuando sientas que solo podrías hacer 2 más.`};
  }
  if(si===null) return {pill:'RESERVA 1 · ÚLTIMA AL FALLO'};
  return last ? {head:`HASTA EL FALLO · MÁX ${hi}`, line:`Última serie: hasta que no puedas más, pero para en ${hi} aunque te queden fuerzas.`}
              : {head:`PARA EN ${hi} · RESERVA 1`, line:`Para al llegar a ${hi} o cuando sientas que solo podrías hacer 1 más.`};
}
function recLine(ex,routine){
  const r=exRec(ex,routine), hi=repRange(ex.reps)[1];
  const col={up:'#4ef09a',down:'#6ea8ff',keep:'#e8f04e',start:'#aaa'}[r.kind], ic={up:'⚡',down:'↓',keep:'',start:''}[r.kind];
  const chg = (r.kind==='down'||r.kind==='up') && r.from ? `<div class="eg-chg ${r.kind}">${r.kind==='down'?'↓ PESO BAJADO':'⚡ PESO SUBIDO'} · de ${r.from} a ${r.w}<small>${r.why||''}</small></div>` : '';
  return chg+`<div class="eg-row"><span class="eg-pill" style="color:#000;background:${col};">${ic?ic+' ':''}${r.w}</span><span class="eg-pill eg-max">MÁX ${hi} REPS</span><span class="eg-pill eg-rir">${effortFor(ex,null).pill}</span></div>${chg?'':`<div class="eg-msg" style="color:${r.kind==='up'?'#4ef09a':'#e8f04e'};">${r.msg}</div>`}`;
}
function liveTip(ex,bid,si){
  const [lo,hi]=repRange(ex.reps), d=getExData();
  if(si==='act') return {w:null,msg:'Serie de activación: peso ligero, 8–10 reps fáciles.'};
  if(si===0) return {w:null,msg:''};
  const pr=getRepsValue(d[`${bid}|${ex.name}|${si-1}`]); const pw=d[`sw|${bid}|${ex.name}|${si-1}`];
  if(!pr) return {w:null,msg:''};
  if(pr>=hi) return {w:pw,msg:`Vas sobrado: mantén ${pw||'el peso'} y clava ${hi}. Si llegas en todas, la próxima sesión subes.`};
  if(pr>=lo) return {w:pw,msg:`Mantén ${pw||'el peso'}. Perder 1–2 reps entre series es normal y cuenta igual.`};
  if(pr>=lo-2) return {w:pw,msg:`Mantén ${pw||'el peso'} aunque salgan menos reps. Si no llegas a ${lo} dos sesiones seguidas, la app te baja un escalón sola.`};
  const dn=pw?wStep(ex,pw,-1):null;
  return {w:dn,msg:`Te quedaste lejos de ${lo}. Baja a ${dn||'un peso menos'} para esta serie (te lo marco en amarillo).`};
}

let repsContext=null;
function tSetChk(bid,exName,si,e){

  const d=getExData(),k=`${bid}|${exName}|${si}`;

function exFinishCheck(bid,ex){
  const d=getExData(), routine=routineOf(bid), [lo,hi]=repRange(ex.reps);
  const sets=Array.from({length:ex.sets},(_,i)=>({r:getRepsValue(d[`${bid}|${ex.name}|${i}`]), w:d[`sw|${bid}|${ex.name}|${i}`]}));
  if(sets.some(x=>!x.r)) return;
  const r=exRec(ex,routine,true), W0=sets[0].w||r.w;
  const sig=r.kind+'|'+sets.map(x=>x.w+'x'+x.r).join(',');
  if(d[`pu|${bid}|${ex.name}`]===sig) return;
  d[`pu|${bid}|${ex.name}`]=sig; saveExData(d);
  const name=(isAlt(bid,ex.name)&&EX_ALT[ex.name])?EX_ALT[ex.name].name:ex.name;
  if(r.kind==='up') return puShow('up',name,W0,r.w,`Has llegado a ${hi} en todas las series. La próxima vez, el peso nuevo ya viene puesto.`);
  if(r.kind==='down') return puShow('down',name,r.from||W0,r.w,`${r.why}. La próxima vez ya viene puesto ${r.w}: con menos peso clavas las reps y vuelves a subir en 1–2 sesiones.`);
  if(r.warn) return puWarn(name,W0,lo);
  const atW=sets.filter(x=>x.w===W0), got=atW.reduce((a,x)=>a+Math.min(x.r,hi),0), need=hi*ex.sets;

}

function exDefByName(name){ for(const r of GYM_ROUTINES){ const e=(EXERCISES[r]||[]).find(x=>x.name===name); if(e) return e; } return null; }
function gymNames(){ const out=[]; GYM_ROUTINES.forEach(r=>(EXERCISES[r]||[]).forEach(e=>{ if(!out.includes(e.name)) out.push(e.name); })); return out; }

function entryW0(e){ const s=entrySets(e); return s[0]?s[0].w:e.weight; }
function entryEarnedUp(name,e){
  const ex=(e.rt&&EXERCISES[e.rt]||[]).find(x=>x.name===name)||exDefByName(name); if(!ex) return false;
  const hi=repRange(ex.reps)[1], s=entrySets(e), w0=s[0]&&s[0].w, at=s.filter(x=>x.w===w0);
  return at.length>=ex.sets && at.every(x=>x.r>=hi);

function gymWeekStats(){

let gcDrag=null;

function gcMove(e){
  if(!gcDrag) return;

  gcDrag.knob.style.transform=`translateX(${x}px) scale(${1+p*0.12})`;

  gcDrag.track.style.setProperty('--gp',p.toFixed(3));

  if(p<=0.88 && gcDrag.buzzed){ gcDrag.buzzed=false; gcDrag.track.classList.remove('armed'); }
}
function gcUp(){
  if(!gcDrag) return;
  const g=gcDrag; gcDrag=null; g.knob.onpointermove=null; g.knob.onpointerup=null;
  if(g.x/g.max>0.88){
    g.knob.style.transition='transform .15s ease-out'; g.fill.style.transition='width .15s ease-out';
    g.knob.style.transform=`translateX(${g.max}px) scale(1.15)`; g.knob.textContent='✓'; g.fill.style.width='100%';
    g.track.classList.add('fired');

    html+=`<div class="gp-k">ESTA SEMANA</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:16px;">
        <div class="gp-tile"><div class="gp-tl">Sesiones</div><div class="bb gp-tv">${st.sessions}<span style="color:#555;font-size:18px;">/4</span></div></div>
        <div class="gp-tile"><div class="gp-tl">Power ups</div><div class="bb gp-tv" style="color:#e8f04e;">⚡ ${st.ups}</div></div>
        <div class="gp-tile"><div class="gp-tl">Estancados</div><div class="bb gp-tv" style="color:${st.stalled.length?'#f09a4e':'#f0ede8'};">${st.stalled.length}</div></div></div>`;
    const names=gymNames(); if(!gymProgEx||!names.includes(gymProgEx)) gymProgEx=names[0];
    html+=`<div class="gp-k">PESO POR EJERCICIO</div>
      <select class="gp-sel" onchange="gymProgEx=this.value;renderGym()">${names.map(n=>`<option ${n===gymProgEx?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select>
      <div class="gp-card">${gymChartHTML(gymProgEx)}</div>`;
    if(st.stalled.length){
      html+=`<div class="gp-k" style="margin-top:16px;">ESTANCADOS</div>`+st.stalled.map(x=>`<div class="gp-warn"><span style="color:#f09a4e;">⚠</span> <span>${escapeHtml(x.name)} · ${x.n} sesiones seguidas en ${escapeHtml(x.w)}</span></div>`).join('')+
        `<div class="gp-sub" style="margin-top:4px;">Revisa que estés respetando la reserva y durmiendo bien. Si sigue igual 2 sesiones más, la app te propondrá bajar un escalón.</div>`;
    }
    const mx=Math.max(10,...Object.values(st.groups));
    html+=`<div class="gp-k" style="margin-top:16px;">SERIES POR GRUPO · ESTA SEMANA</div>
      <div style="display:grid;grid-template-columns:62px minmax(0,1fr) 26px;gap:8px 8px;align-items:center;">`+
      Object.entries(st.groups).map(([g,n])=>`<span style="font-size:12px;color:#aaa;">${g}</span><div style="height:8px;background:#1c1c1c;border-radius:4px;overflow:hidden;"><div style="width:${Math.round(n/mx*100)}%;height:100%;background:#e8f04e;border-radius:4px;"></div></div><span class="mono" style="font-size:11px;color:#ccc;text-align:right;">${n}</span>`).join('')+`</div>`;
  }
  if(gymView!=='hoy') html+=backupHTML();
  const wasPast=!!gymPastIso; gymPastIso=null;
  app.innerHTML=html;
  gymClockPaint();
  if(wasPast){ const c=document.getElementById('gym-clock'); if(c){ c.textContent='Sesión de otro día'; c.style.color='#666'; } }
}
setInterval(()=>{ const g=document.getElementById('section-gym'); if(g && g.style.display!=='none') gymClockPaint(); },15000);
// recuperar un descanso en marcha si la página se ha recargado
(function(){ try{ const t=JSON.parse(localStorage.getItem('gymRestTimer')||'null');
  if(t && t.end && t.end>Date.now()-5000){ gymTimer=t; gymTick=setInterval(gymTimerPaint,250); } else localStorage.removeItem('gymRestTimer'); }catch(e){} })();


// ── TUTORIAL ──
const TOUR_KEY='migym_tour_v1';
const TOUR=[
  {t:'Bienvenido a Mi Gym 💪',d:'Te enseño cómo funciona en 1 minuto. La idea: 4 rutinas por semana, en el orden y el día que quieras, y la app te dice cuándo subir de peso.'},
  {sel:()=>{const c=document.querySelector('.gr-chip');return c&&c.parentElement;},t:'Tus 4 rutinas',d:'Elige la que toque hoy. Cuando completas una, sale con ✓. El objetivo es hacer las 4 en la semana; cada lunes se reinician.'},
  {sel:'.gym-rule',t:'La regla de oro',d:'Mantén el peso y deja que bajen las repeticiones. La app sube o baja el peso por ti cuando toca.'},
  {sel:'.exs-row .eg-row',t:'Qué hacer en cada ejercicio',d:'Peso sugerido · tope de repeticiones · reserva. «Reserva 2» significa parar cuando te queden unas 2 repeticiones en el depósito, sin llegar al fallo.'},
  {sel:'.exs-row .set-chk.activation',t:'Calentamiento',d:'Antes del ejercicio, haz una serie ligera y tócala aquí. Arranca un descanso corto.'},
  {sel:'.exs-row .set-chk:not(.activation)',t:'Apunta cada serie',d:'Al acabar cada serie, tócala y elige el peso y las repeticiones que has hecho. La primera vez puedes elegir cualquier peso. Para corregirla, tócala otra vez.'},
  {sel:()=>{const b=document.querySelector('.ex-info-btn');return b&&b.closest('.exs-name');},t:'Cómo se hace',d:'ⓘ abre la explicación y el vídeo del ejercicio. Si la máquina está ocupada, «MÁQ» te cambia a una alternativa.'},
  {t:'Descanso automático ⏱',d:'Al guardar una serie aparece abajo una cuenta atrás con el descanso que toca. Puedes sumar 30 s o saltarla. Vibra cuando termina.'},
  {sel:'.gc-wrap',t:'Completa la rutina',d:'Los ejercicios con borde discontinuo son opcionales. Cuando acabes los obligatorios se desbloquea esta barra: deslízala para cerrar el día y celebrarlo.'},
  {sel:()=>document.querySelectorAll('.gv-btn')[1],t:'Tu progreso',d:'Aquí ves cómo sube tu peso en cada ejercicio, los «power ups» de la semana y los ejercicios en los que te has estancado. Abajo del todo puedes hacer una copia de seguridad.'},
  {sel:'#tour-help',t:'¡A entrenar!',d:'Si alguna vez te pierdes, toca aquí y vuelve a ver este tutorial.'},
];
let tourI=-1;
function tourEl(st){ if(!st.sel) return null; const e=typeof st.sel==='function'?st.sel():document.querySelector(st.sel); return e&&e.getBoundingClientRect().width?e:null; }
function tourStart(){
  if(gymView!=='hoy'){ gymView='hoy'; renderGym(); }
  let o=document.getElementById('tour'); if(!o){ o=document.createElement('div'); o.id='tour'; document.body.appendChild(o); }
  o.innerHTML='<div id="tour-hole"></div><div id="tour-card"></div>'; o.className='show';
  document.body.style.overflow='hidden';
  tourI=0; tourPaint();
}
function tourEnd(){
  const o=document.getElementById('tour'); if(o) o.className='';
  document.body.style.overflow=''; tourI=-1;
  try{ localStorage.setItem(TOUR_KEY,'1'); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function tourGo(n){ tourI=Math.max(0,Math.min(TOUR.length-1,tourI+n)); tourPaint(); }
function tourPaint(){
  if(tourI<0) return;
  const st=TOUR[tourI], el=tourEl(st), hole=document.getElementById('tour-hole'), card=document.getElementById('tour-card');
  if(el){ const r0=el.getBoundingClientRect(); window.scrollTo({top:Math.max(0,window.scrollY+r0.top-Math.max(90,(window.innerHeight-r0.height)/2-80))}); }
  const last=tourI===TOUR.length-1;
  card.innerHTML=`<div class="tour-step">${tourI+1} / ${TOUR.length}</div>
    <div class="tour-t">${st.t}</div><div class="tour-d">${st.d}</div>
    <div class="tour-dots">${TOUR.map((_,i)=>`<i class="${i===tourI?'on':i<tourI?'past':''}"></i>`).join('')}</div>
    <div class="tour-btns">${last?'':'<button class="tour-skip" onclick="tourEnd()">Saltar</button>'}
      ${tourI>0?'<button class="tour-back" onclick="tourGo(-1)">Atrás</button>':''}
      <button class="tour-next" onclick="${last?'tourEnd()':'tourGo(1)'}">${last?'Empezar':'Siguiente'}</button></div>`;
  const vw=window.innerWidth, vh=window.innerHeight, cw=Math.min(340,vw-32);
  card.style.width=cw+'px';
  if(!el){
    hole.className='none'; hole.style.cssText='';
    card.style.left=((vw-cw)/2)+'px'; card.style.top=Math.max(16,(vh-card.offsetHeight)/2)+'px';
    return;
  }
  const r=el.getBoundingClientRect(), pad=6;
  hole.className='';
  hole.style.left=(r.left-pad)+'px'; hole.style.top=(r.top-pad)+'px'; hole.style.width=(r.width+pad*2)+'px'; hole.style.height=(r.height+pad*2)+'px';
  const ch=card.offsetHeight, below=r.bottom+pad+14, above=r.top-pad-14-ch;
  let top = below+ch<=vh-12 ? below : (above>=12 ? above : Math.max(12,vh-ch-12));
  const left=Math.max(16,Math.min(vw-cw-16,r.left+r.width/2-cw/2));
  card.style.left=left+'px'; card.style.top=top+'px';
}
window.addEventListener('resize',()=>{ if(tourI>=0) tourPaint(); });


// ── INICIO ──
renderGym();
if(gymTimer) gymTimerPaint();
try{ if(!localStorage.getItem(TOUR_KEY)) setTimeout(tourStart,500); }catch(e){}

</script>
</body>
</html>
